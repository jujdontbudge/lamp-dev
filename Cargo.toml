[workspace]
resolver = "2"
members = ["crates/*", "tools/protogen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
prost = "0.14.1"
libc = "0.2.177"
ed25519-dalek = "3.0.0"
sha2 = "0.11.1"
toml = "1.2.1"
