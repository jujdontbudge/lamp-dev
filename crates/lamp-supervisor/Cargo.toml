[package]
name = "lamp-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Privileged local Lamp supervisor serving lamp.worker/1 over a peer-authenticated Unix socket."

[dependencies]
lamp-worker-protocol = { path = "../lamp-worker-protocol" }
lamp-engine = { path = "../lamp-engine" }
lamp-init = { path = "../lamp-init" }
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
prost.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
fault-injection = ["lamp-engine/fault-injection"]
