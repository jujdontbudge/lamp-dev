# SPDX-License-Identifier: Apache-2.0
# Only the public project publishes lamp.eilmer.si (GitLab Pages, shared runners).
# No self-hosted runner serves this project.
pages:
  image: python:3.13-alpine
  variables:
    LAMP_RELEASE: "0.1.1"
  script:
    - python3 tools/release/site.py --out public --version "$LAMP_RELEASE" --packages "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/lamp"
  artifacts:
    paths: [public]
  rules:
    - if: $CI_PROJECT_PATH == "johansardar/lamp" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
