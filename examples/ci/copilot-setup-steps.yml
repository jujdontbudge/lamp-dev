# Repository configuration example, not a claim about vendor cloud placement.
# Copy to .github/workflows/copilot-setup-steps.yml in a disposable fixture.
# See docs/ci.md for the native route's remaining live-validation gap.
name: Copilot setup on Lamp
on: workflow_dispatch
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: [self-hosted, lamp, 'lamp-${{ github.run_id }}-${{ github.run_attempt }}-copilot']
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: git --version && python3 --version
